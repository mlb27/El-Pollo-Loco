<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>El Pollo Loco</title>

  <script src="./models/audio-manager.class.js"></script>
  <script src="./models/drawable-object.class.js"></script>
  <script src="./models/movable-object.class.js"></script>
  <script src="./models/character.class.js"></script>
  <script src="./models/chicken.class.js"></script>
  <script src="./models/chicken-small.class.js"></script>
  <script src="./models/cloud.class.js"></script>
  <script src="./models/health-bar.class.js"></script>
  <script src="./models/bottle-bar.class.js"></script>

<body onload="init()">
  <main class="game-container">
    <h1>El Pollo Loco</h1>
    <canvas id="canvas" width="720" height="480"></canvas>
    <div class="audio-controls">
      <button id="soundEffectsButton" class="menu-icon-button sound-effects-button is-enabled" type="button"
        onclick="toggleSoundEffects()" aria-label="Soundeffekte ausschalten" aria-pressed="true"
        title="Soundeffekte ausschalten"></button>
      <button id="musicButton" class="menu-icon-button music-button is-enabled" type="button" onclick="toggleMusic()"
        aria-label="Soundtrack ausschalten" aria-pressed="true" title="Soundtrack ausschalten"></button>
    </div>
  </main>
</body>
